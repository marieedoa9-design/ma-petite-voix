name: Fabriquer l'appli Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fabriquer l'APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk MaPetiteVoix.apk

      - name: Publier le fichier à télécharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Ma Petite Voix ${{ github.run_number }}
          files: MaPetiteVoix.apk
          make_latest: true

      - name: Journal en cas de problème
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: journal-${{ github.run_number }}
          name: Journal ${{ github.run_number }}
          files: build.log
          prerelease: true
          make_latest: false
